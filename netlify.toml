[build]
  publish = "out"
  command = "npm run build"

# ─── Security headers (all pages) ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Disable Adobe Flash / Acrobat cross-domain policy files
    X-Permitted-Cross-Domain-Policies = "none"
    # Enforce HTTPS for 2 years, include subdomains
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Limit referrer info to same origin
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable browser features not needed by this app
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Content Security Policy
    # - unsafe-inline required: Next.js static export injects inline hydration scripts
    # - script-src 'unsafe-inline' can be tightened with a nonce once SSR is added
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://cloudflareinsights.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# ─── Static asset headers ─────────────────────────────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Redirect old paths if needed (example)
# [[redirects]]
#   from = "/old-page"
#   to = "/new-page"
#   status = 301
